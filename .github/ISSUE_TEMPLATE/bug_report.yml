name: Bug report
description: Report a reproducible problem with the app or build
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real location traces, private messages, model files, or
        security vulnerabilities. Security issues go through SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Actual behaviour and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Assist / on-device AI
        - Map / offline packs
        - Chat / Bluetooth mesh
        - SOS
        - Kit / preparedness
        - Onboarding / downloads
        - Build / release
        - Other
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build and device
      description: Variant (full/lite), ABI, app version, Android version, device model.
      placeholder: full arm64, 0.1.0, Android 14, Pixel 7
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Kit → Device and data values (radio, links, peers, frames, location), and adb logcat if available.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed personal data from logs and screenshots.
          required: true
        - label: This is not a security vulnerability.
          required: true
